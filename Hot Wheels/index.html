<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Día de los Hot Wheels</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050515;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Pantalla de Inicio / Bienvenida */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #1a1a3a 0%, #050515 100%);
      z-index: 10;
      transition: opacity 0.8s ease;
    }

    h1 {
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 25px;
      text-shadow: 0 0 15px rgba(0, 150, 255, 0.8);
      text-align: center;
    }

    .btn-discover {
      padding: 12px 35px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #ff0055, #ff5500);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 85, 0, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-discover:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 85, 0, 0.9);
    }

    /* Escena Principal */
    #main-scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    #main-scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    .header-text {
      margin-top: 40px;
      text-align: center;
      z-index: 2;
    }

    .header-text h2 {
      font-size: 2rem;
      color: #fff;
      text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
    }

    .header-text p {
      font-size: 1.5rem;
      margin-top: 5px;
    }

    /* Contenedor del Ramo */
    .bouquet-container {
      position: relative;
      width: 320px;
      height: 420px;
      margin-bottom: 50px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* Tallos de las flores */
    .stems {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 200px;
    }

    .stem {
      position: absolute;
      bottom: 0;
      width: 4px;
      background: linear-gradient(to top, #00ff66, #008833);
      border-radius: 2px;
      transform-origin: bottom center;
    }

    .stem-1 { height: 220px; left: 50%; transform: rotate(0deg); }
    .stem-2 { height: 200px; left: 50%; transform: rotate(-15deg); }
    .stem-3 { height: 200px; left: 50%; transform: rotate(15deg); }
    .stem-4 { height: 180px; left: 50%; transform: rotate(-30deg); }
    .stem-5 { height: 180px; left: 50%; transform: rotate(30deg); }

    /* Estructura de cada carrito */
    .car-wrapper {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(0,150,255,0.4) 70%, transparent 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 200, 255, 0.6);
      animation: float 3s infinite ease-in-out;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .car-wrapper:hover {
      transform: scale(1.15) !important;
    }

    .car-img {
      width: 75px;
      height: auto;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
    }

    /* Posicionamiento en el ramo */
    .pos-1 { top: 20px; left: 115px; animation-delay: 0s; }
    .pos-2 { top: 70px; left: 50px; animation-delay: 0.5s; }
    .pos-3 { top: 70px; left: 180px; animation-delay: 1s; }
    .pos-4 { top: 140px; left: 15px; animation-delay: 1.5s; }
    .pos-5 { top: 140px; left: 215px; animation-delay: 2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* Fondo con estrellas */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      background-color: white;
      border-radius: 50%;
      opacity: 0.6;
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Reproductor de Audio (Oculto) -->
  <!-- Cambia 'musica.mp3' por la ruta o nombre de tu archivo de música -->
  <audio id="bg-music" loop>
    <source src="Coldplay - Yellow (lyrics).mp3" type="audio/mpeg">
    Tu navegador no soporta el elemento de audio.
  </audio>

  <!-- Fondo de Estrellas -->
  <div class="stars" id="stars-container"></div>

  <!-- Pantalla de Bienvenida -->
  <div id="start-screen">
    <h1>Feliz Día de los<br> Carritos Hot Wheels</h1>
    <button class="btn-discover" onclick="startExperience()">DESCUBRIR</button>
  </div>

  <!-- Escena Principal -->
  <div id="main-scene">
    <div class="header-text">
      <h2>Feliz 30 de Septiembre</h2>
      <p>💚</p>
    </div>

    <div class="bouquet-container">
      <!-- Tallos -->
      <div class="stems">
        <div class="stem stem-1"></div>
        <div class="stem stem-2"></div>
        <div class="stem stem-3"></div>
        <div class="stem stem-4"></div>
        <div class="stem stem-5"></div>
      </div>

      <!-- Carritos del Ramo -->
      <div class="car-wrapper pos-1">
        <img class="car-img" src="1.jpg" alt="Hot Wheels">
      </div>
      <div class="car-wrapper pos-2">
        <img class="car-img" src="2.jpg" alt="Hot Wheels">
      </div>
      <div class="car-wrapper pos-3">
        <img class="car-img" src="3.jpg" alt="Hot Wheels">
      </div>
      <div class="car-wrapper pos-4">
        <img class="car-img" src="4.jpg" alt="Hot Wheels">
      </div>
      <div class="car-wrapper pos-5">
        <img class="car-img" src="5.jpg" alt="Hot Wheels">
      </div>
    </div>
  </div>

  <script>
    // Generación dinámica de fondo estrellado
    const starsContainer = document.getElementById('stars-container');
    const starCount = 60;

    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      const size = Math.random() * 3 + 1;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.animationDelay = `${Math.random() * 3}s`;
      starsContainer.appendChild(star);
    }

    // Transición de la pantalla inicial al ramo e inicio de la música
    function startExperience() {
      const startScreen = document.getElementById('start-screen');
      const mainScene = document.getElementById('main-scene');
      const music = document.getElementById('bg-music');

      // Reproduce la música
      music.play().catch(error => {
        console.log("Error al reproducir audio:", error);
      });

      startScreen.style.opacity = '0';
      setTimeout(() => {
        startScreen.style.display = 'none';
        mainScene.classList.add('active');
      }, 800);
    }
  </script>
</body>
</html>
